name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application version
        run: npm run version:check

      - name: Run unit tests
        run: npm run test:run

      - name: Install coverage provider
        run: rm -f package-lock.json && npm install --no-save @vitest/coverage-v8@4.1.11

      - name: Test coverage
        run: npm run test:coverage

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Check coverage regression
        if: github.event_name == 'pull_request'
        run: |
          git worktree add --detach /tmp/privateAI-base origin/master
          trap 'git worktree remove --force /tmp/privateAI-base' EXIT
          cd /tmp/privateAI-base
          npm ci
          rm -f package-lock.json && npm install --no-save @vitest/coverage-v8@4.1.11
          npx vitest run --coverage --coverage.reporter=json-summary
          cd -
          node scripts/check-coverage.mjs coverage/coverage-summary.json /tmp/privateAI-base/coverage/coverage-summary.json

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Validate task metadata
        run: npm run tasks:validate

      - name: Validate pull request task
        if: github.event_name == 'pull_request'
        run: node scripts/validate-pr-task.mjs
