name: Automatic version bump

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: application-version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check whether version already changed
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          HEAD_VERSION=$(node -p "require('./package.json').version")
          BASE_VERSION=$(git show "${BASE_SHA}:package.json" | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => console.log(JSON.parse(s).version))")

          echo "head=${HEAD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE_VERSION}" >> "$GITHUB_OUTPUT"

          if [ "$HEAD_VERSION" = "$BASE_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.version.outputs.changed == 'false'
        run: npm version patch --no-git-tag-version

      - name: Validate application version
        run: npm run version:check

      - name: Commit version bump
        if: steps.version.outputs.changed == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump application version to v${VERSION}"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
